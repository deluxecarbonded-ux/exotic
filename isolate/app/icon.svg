<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .b { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.05s ease-in-out infinite; }
    .b2 { animation-duration: .85s; animation-delay: .12s; }
    .b3 { animation-duration: 1.2s; animation-delay: .24s; }
    .b4 { animation-duration: .95s; animation-delay: .36s; }
    @keyframes eq {
      0%, 100% { transform: scaleY(1); }
      28% { transform: scaleY(1.3); }
      55% { transform: scaleY(.8); }
      80% { transform: scaleY(1.16); }
    }
    @media (prefers-reduced-motion: reduce) { .b { animation: none; } }
  </style>
  <rect width="64" height="64" rx="16" fill="#000000"/>
  <rect class="b b1" x="10" y="26" width="10" height="12" rx="3" fill="#ffffff"/>
  <rect class="b b2" x="23" y="20" width="10" height="18" rx="3" fill="#ffffff" opacity="0.8"/>
  <rect class="b b3" x="36" y="24" width="10" height="14" rx="3" fill="#ffffff" opacity="0.6"/>
  <rect class="b b4" x="49" y="28" width="5" height="10" rx="2.5" fill="#ffffff" opacity="0.4"/>
</svg>
